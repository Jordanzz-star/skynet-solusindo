<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="45%" stop-color="#081125"/>
      <stop offset="100%" stop-color="#060917"/>
    </linearGradient>

    <!-- Fiber Core Laser Glow -->
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="apBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserBurst" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dotNet" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00f0ff" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  <rect width="800" height="500" fill="url(#dotNet)"/>

  <!-- Glowing Aura -->
  <circle cx="250" cy="240" r="180" fill="#00f0ff" opacity="0.08" filter="url(#laserBurst)"/>
  <circle cx="580" cy="210" r="170" fill="#2563eb" opacity="0.12" filter="url(#laserBurst)"/>

  <!-- Left Side: FIBER OPTIC CABLES & FUSION SPLICER -->
  <g transform="translate(60, 60)">
    <!-- Tech Frame -->
    <rect x="0" y="0" width="340" height="380" rx="10" fill="rgba(11, 20, 38, 0.75)" stroke="#1e2f4f" stroke-width="2"/>
    <rect x="2" y="2" width="336" height="376" rx="8" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.3"/>

    <!-- Section Header Tag -->
    <text x="20" y="32" fill="#fff" font-family="'Outfit', sans-serif" font-size="12" font-weight="800">INFRASTRUKTUR FIBER OPTIC</text>
    <text x="20" y="48" fill="#00f0ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Core Singlemode • Splicing Presisi &lt;0.02 dB</text>

    <!-- Glowing High-Tech Fiber Cable Strands -->
    <g transform="translate(20, 65)">
      <!-- Main Thick Armored Cable Jacket -->
      <path d="M 0 100 Q 80 40 160 90 T 300 80" stroke="#0f172a" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M 0 100 Q 80 40 160 90 T 300 80" stroke="#1e293b" stroke-width="16" fill="none" stroke-linecap="round"/>

      <!-- Glowing Exposed Fiber Buffer Tubes -->
      <path d="M 40 100 C 90 70 120 140 180 120 C 230 100 270 140 300 130" stroke="#38bdf8" stroke-width="4" fill="none" filter="url(#glowF)"/>
      <path d="M 40 105 C 80 80 130 150 190 130 C 240 110 270 150 300 140" stroke="#facc15" stroke-width="3" fill="none"/>
      <path d="M 40 110 C 90 90 140 160 200 140 C 250 120 280 160 300 150" stroke="#10b981" stroke-width="3" fill="none"/>

      <!-- Glass Fiber Cores Emitting Laser Beams -->
      <path d="M 120 120 C 170 80 220 100 270 90" stroke="#ffffff" stroke-width="2" fill="none" filter="url(#glowF)"/>
      <circle cx="270" cy="90" r="5" fill="#00f0ff" filter="url(#laserBurst)"/>
      <circle cx="270" cy="90" r="2" fill="#ffffff"/>

      <path d="M 140 140 C 190 110 230 130 290 115" stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#glowF)"/>
      <circle cx="290" cy="115" r="5" fill="#00f0ff" filter="url(#laserBurst)"/>
      <circle cx="290" cy="115" r="2" fill="#ffffff"/>
    </g>

    <!-- Splicer Digital Alignment Screen -->
    <g transform="translate(20, 235)">
      <rect x="0" y="0" width="300" height="115" rx="6" fill="#050a14" stroke="#00f0ff" stroke-width="1.2"/>
      
      <!-- Screen Header -->
      <rect x="0" y="0" width="300" height="22" rx="6" fill="#0b172e"/>
      <text x="12" y="15" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="8" font-weight="700">OTDR &amp; FUSION CORE ALIGNMENT MONITOR</text>
      <circle cx="285" cy="11" r="3" fill="#10b981" filter="url(#glowF)"/>

      <!-- Left Core / Right Core Alignment Graphic -->
      <line x1="20" y1="65" x2="135" y2="65" stroke="#00f0ff" stroke-width="4" filter="url(#glowF)"/>
      <line x1="165" y1="65" x2="280" y2="65" stroke="#00f0ff" stroke-width="4" filter="url(#glowF)"/>
      
      <!-- Arc Discharge Spark (The fusion moment) -->
      <line x1="135" y1="50" x2="165" y2="80" stroke="#ffffff" stroke-width="2" filter="url(#laserBurst)"/>
      <line x1="135" y1="80" x2="165" y2="50" stroke="#ffffff" stroke-width="2" filter="url(#laserBurst)"/>
      <circle cx="150" cy="65" r="8" fill="#00f0ff" opacity="0.8" filter="url(#laserBurst)"/>
      <circle cx="150" cy="65" r="3" fill="#ffffff"/>

      <!-- Digital Metrics -->
      <text x="20" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">ESTIMATED LOSS:</text>
      <text x="95" y="100" fill="#10b981" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">0.01 dB (OPTIMAL)</text>

      <text x="180" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">TENSION TEST:</text>
      <text x="245" y="100" fill="#00f0ff" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">2.1 N PASS</text>
    </g>
  </g>

  <!-- Right Side: ENTERPRISE WI-FI ACCESS POINT (UniFi Style) & ROAMING COVERAGE -->
  <g transform="translate(430, 60)">
    <!-- Tech Frame -->
    <rect x="0" y="0" width="320" height="380" rx="10" fill="rgba(11, 20, 38, 0.75)" stroke="#1e2f4f" stroke-width="2"/>
    <rect x="2" y="2" width="316" height="376" rx="8" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.4"/>

    <!-- Section Header Tag -->
    <text x="20" y="32" fill="#fff" font-family="'Outfit', sans-serif" font-size="12" font-weight="800">WI-FI 6 ENTERPRISE SYSTEM</text>
    <text x="20" y="48" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">38 Unit AP UniFi • Seamless Roaming</text>

    <!-- Concentric Wi-Fi Signal Waves Radiating from AP -->
    <g transform="translate(160, 180)">
      <circle cx="0" cy="0" r="140" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.3"/>
      <circle cx="0" cy="0" r="115" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.5"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
      <circle cx="0" cy="0" r="70" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8" filter="url(#glowF)"/>

      <!-- Ceiling Mount AP Disk Body -->
      <circle cx="0" cy="0" r="50" fill="url(#apBody)" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="46" fill="#090e1a"/>

      <!-- Iconic Electric Blue Glowing Halo Ring (UniFi LED Ring) -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="#00f0ff" stroke-width="3.5" filter="url(#glowF)"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>

      <!-- Center Logo / Sensor Node -->
      <circle cx="0" cy="0" r="12" fill="#050811" stroke="#1e293b" stroke-width="1"/>
      <path d="M -6 0 L 0 -6 L 6 0 L 0 6 Z" fill="#00f0ff"/>
    </g>

    <!-- Signal Metrics & Roaming Telemetry Box -->
    <g transform="translate(20, 290)">
      <rect x="0" y="0" width="280" height="65" rx="6" fill="#070c18" stroke="#1e293b" stroke-width="1"/>
      <g transform="translate(14, 16)">
        <text x="0" y="10" fill="#fff" font-family="'Outfit', sans-serif" font-size="10" font-weight="700">STATUS COVERAGE: 100% DEAD-ZONE FREE</text>
        <text x="0" y="26" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Standard: 802.11ax Wi-Fi 6 Dual-Band (2.4/5GHz)</text>
        
        <!-- Signal Bars -->
        <g transform="translate(210, -3)">
          <rect x="0" y="14" width="4" height="6" rx="1" fill="#10b981"/>
          <rect x="7" y="10" width="4" height="10" rx="1" fill="#10b981"/>
          <rect x="14" y="6" width="4" height="14" rx="1" fill="#10b981"/>
          <rect x="21" y="2" width="4" height="18" rx="1" fill="#10b981"/>
          <rect x="28" y="-2" width="4" height="22" rx="1" fill="#10b981"/>
        </g>
        <text x="0" y="40" fill="#00f0ff" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="700">VLAN ISOLASI: TAMU &amp; OPERASIONAL TERPISAH</text>
      </g>
    </g>
  </g>

  <!-- Floating Telemetry Pills Bottom -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="290" height="40" rx="20" fill="rgba(8, 14, 28, 0.9)" stroke="#00f0ff" stroke-width="1"/>
    <circle cx="20" cy="20" r="4" fill="#10b981" filter="url(#glowF)"/>
    <text x="32" y="24" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="10" font-weight="700">BACKBONE FO: 10 Gbps ANTAR LANTAI</text>
  </g>

  <g transform="translate(430, 440)">
    <rect x="0" y="0" width="300" height="40" rx="20" fill="rgba(8, 14, 28, 0.9)" stroke="#2563eb" stroke-width="1"/>
    <circle cx="20" cy="20" r="4" fill="#00f0ff" filter="url(#glowF)"/>
    <text x="32" y="24" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="10" font-weight="700">ROAMING: HANDOFF 0ms (NO BUFFERING)</text>
  </g>
</svg>
